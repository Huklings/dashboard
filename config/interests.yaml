# Your interests. Edit this file on github.com and the site rebuilds.
#
# Each topic picks up articles whose title or summary contains one of its
# `include` keywords (case-insensitive, whole words), unless it also contains
# an `exclude` keyword. Feeds listed under a topic's `sources` go to that topic
# even without a keyword match. Feeds under the top-level `sources` are only
# matched by keywords. Articles that match no topic are dropped.
#
# YouTube channels: add `youtube:<channel id>` (it starts with UC) as a source.
# New uploads show up in the video row and link to YouTube. To find the ID,
# open the channel, click "more" in its description, then "Share channel" →
# "Copy channel ID". Pin a channel under a topic's `sources` to get all its
# videos in that topic.

spaces:
  work:
    - name: Security advisories
      include: [CVE, vulnerability, exploit, ransomware, zero-day, patch]
      exclude: [webinar]
    - name: Web development
      include: [TypeScript, JavaScript, React, Node.js, browser, CSS]
    - name: Cloud
      include: [AWS, Azure, Kubernetes, Terraform, serverless]
  hobby:
    - name: Worldbuilding
      include: [worldbuilding, world-building, magic system, magic systems, conlang, conlangs, fantasy map, fictional world, lore]
      sources:
        - https://worldbuilding.stackexchange.com/feeds
        - https://www.reddit.com/r/worldbuilding/top/.rss?t=day
        - youtube:UCeh-pJYRZTBJDXMNZeWSUVA # Artifexian
        - youtube:UCMjTcpv56G_W0FRIdPHBn4A # Biblaridion
        - youtube:UCnVqE5aiTqVJdRxhszBaHoQ # The Fantasy Forge
        - youtube:UCZ0l702Df6x8JB5g4IM2PVA # Grainbound
        - youtube:UCf5MDxxTuT1OpwOxVfG-ofg # World Anvil Worldbuilding
    - name: Fantasy and sci-fi
      include: [fantasy, science fiction, sci-fi, SFF, Tolkien, Sanderson, Dune, Dungeons & Dragons]
      sources:
        - youtube:UCFQMO-YL87u-6Rt8hIVsRjA # Hello Future Me
    - name: Myth and storytelling
      include: [mythology, myth, myths, folklore, legend, legends, storytelling, trope, tropes]
      sources:
        - https://mythcreants.com/feed/
        - youtube:UC2JZfLZcZCgVvTMKjo2_BwA # Tale Foundry
        - youtube:UCodbH5mUeF-m_BsNueRDjcw # Overly Sarcastic Productions

